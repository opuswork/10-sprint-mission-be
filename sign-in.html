<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Sign In</title>
    <link rel="stylesheet" href="./css/sign-in-and-up.css">
</head>
<body>
<!-- 
    header tag는 사이트의 로고와 (메뉴-nav), 로그인 버튼 등을 포함한다. 
    그러므로, 가능하다면, header tag는 사이트의 최고 상단에 위치시키는 것이 좋다.
    왜냐하면 독립적인 페이지에 포함된 로고와 같은 독립적인 요소들만 있을 경우 header에 
    포함시키지 않는 것이 좋기 때문이다. 
    
    *** header tag의 역할을 명확히 구분하는 것이 SEO 에 도움이 된다.

    그러므로, 아래의 header tag 내에 로고 이미지는 main tag안으로 이동시키는 것이 추천되는 방식이다.

    ***** 예외적인 경우도 있음 *****

    footer tag는 페이지의 최하단에 위치하는 경우가 많다.
    footer tag 내에 사이트의 저작권 정보, 개인정보처리방침, 이용약관, 회사소개, 고객센터 등의 링크를 포함하는 경우가 많다.
    그러므로, 독립적인 페이지에 포함된 회원가입 링크와 같은 독립적인
    요소들만 있을 경우 footer에 포함시키지 않는 것이 좋다.
    *** footer tag의 역할을 명확히 구분하는 것이 SEO 에 도움이 된다.

    아래의 footer tag 내에 회원가입 링크는 main tag안으로 이동시키는 것이 추천되는 방식이다.

    추후, 수정하겠음.(by Brian)
//-->

<header>
    <div class="logo-container">
        <a href="/"><img class="logo-img" src="./images/Panda_logo-login.svg" alt="판다마켓"></a>
    </div>
</header>

<main>
    <form method="post">
        <label for="username">이메일</label>
        <input id="username" name="email" placeholder="이메일을 입력하세요." required>
        <label for="password">비밀번호</label>
        <div class="inputPWD">
            <input id="passwordInput" name="password" type="password" placeholder="비밀번호를 입력하세요." required>
            <img class="fa-eye" src="./images/fa-eye.svg" alt="비밀번호 보기">
        </div>
        <button type="submit" aria-label="로그인 하기">로그인</button>
    </form>
</main>


<!-- 
    footerLogin class를 socialLogin으로 변경하고, 
    footer의 이름을 변경하여 둘다 main tag 안으로 이동시킨다. 
//-->

<div class="footerLogin">
    간편 로그인하기
    <div class="social-login-button">
        <a href="https://www.google.com/" target="_blank"><img src="./images/google_button.svg" width="42"/></a>
        <a href="https://www.kakaocorp.com/page/" target="_blank"><img src="./images/kakao-button.svg" width="42"/></a>
    </div>
</div>

<footer>
    판다마켓이 처음이신가요? <a href="./sign-up.html">회원가입</a>
</footer>


</body>
</html>
